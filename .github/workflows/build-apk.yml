```yaml
name: Build StudyLens APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          if [ -f "gradlew" ]; then
            PROJECT_DIR="."
          else
            for dir in */; do
              if [ -f "${dir}gradlew" ]; then
                PROJECT_DIR="${dir%/}"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ No Gradle Android project found."
            echo "The repository must contain gradlew."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "✅ Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyLens-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
```
